<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a12;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    canvas {
      display: block;
      border: 1px solid #1a1a3a;
      box-shadow: 0 0 60px rgba(0, 255, 136, 0.08);
    }
  </style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;

const HUD_H = 48;
const PLAYER_W = 44, PLAYER_H = 26;
const PLAYER_Y = H - 58;
const PLAYER_SPEED = 320;
const BULLET_W = 3, BULLET_H = 16;
const BULLET_SPEED = 560;
const ALIEN_W = 36, ALIEN_H = 24;
const GAP_X = 16, GAP_Y = 14;
const COLS = 11, ROWS = 5;
const DROP_STEP = 20;
const BASE_SPEED = 52;
const SPEED_BOOST = 240;

const ROW_SCORES = [30, 20, 20, 10, 10];

// Static stars
const STARS = Array.from({ length: 90 }, (_, i) => ({
  x: (i * 137 + 31) % W,
  y: HUD_H + (i * 211 + 73) % (H - HUD_H),
  r: i % 5 === 0 ? 2 : 1,
  a: 0.25 + (i % 7) * 0.08,
}));

let state = 'start';
let score = 0, level = 1;
let player, bullet, aliens, explosions, killCount, totalAliens;
let alienDir, alienOffsetX, alienGroupY, baseAlienSpeed;
let levelClearTimer = 0;

const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))
    e.preventDefault();
  if (!keys[e.code]) {
    keys[e.code] = true;
    if (e.code === 'Space') handleSpace();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function handleSpace() {
  if (state === 'start' || state === 'gameOver') startGame();
  else if (state === 'playing') fireBullet();
}

function startGame() {
  score = 0;
  level = 1;
  initLevel();
  state = 'playing';
}

function initLevel() {
  player = { x: W / 2 - PLAYER_W / 2, y: PLAYER_Y };
  bullet = null;
  explosions = [];
  killCount = 0;
  totalAliens = COLS * ROWS;
  baseAlienSpeed = BASE_SPEED + (level - 1) * 18;
  alienDir = 1;
  const gridW = COLS * ALIEN_W + (COLS - 1) * GAP_X;
  alienOffsetX = (W - gridW) / 2;
  alienGroupY = HUD_H + 10 + Math.min((level - 1) * 12, 72);
  aliens = [];
  for (let row = 0; row < ROWS; row++)
    for (let col = 0; col < COLS; col++)
      aliens.push({ row, col, alive: true, pts: ROW_SCORES[row] });
}

function fireBullet() {
  if (bullet) return;
  bullet = { x: player.x + PLAYER_W / 2 - BULLET_W / 2, y: player.y - BULLET_H };
}

function alienX(col) { return alienOffsetX + col * (ALIEN_W + GAP_X); }
function alienY(row) { return alienGroupY + row * (ALIEN_H + GAP_Y); }
function effectiveSpeed() { return baseAlienSpeed + (killCount / totalAliens) * SPEED_BOOST; }

function update(dt) {
  if (keys['ArrowLeft'] || keys['KeyA'])
    player.x = Math.max(0, player.x - PLAYER_SPEED * dt);
  if (keys['ArrowRight'] || keys['KeyD'])
    player.x = Math.min(W - PLAYER_W, player.x + PLAYER_SPEED * dt);

  if (bullet) {
    bullet.y -= BULLET_SPEED * dt;
    if (bullet.y + BULLET_H < 0) {
      bullet = null;
    } else {
      for (const a of aliens) {
        if (!a.alive) continue;
        const ax = alienX(a.col), ay = alienY(a.row);
        if (bullet.x < ax + ALIEN_W && bullet.x + BULLET_W > ax &&
            bullet.y < ay + ALIEN_H && bullet.y + BULLET_H > ay) {
          a.alive = false;
          score += a.pts;
          killCount++;
          explosions.push({ x: ax + ALIEN_W / 2, y: ay + ALIEN_H / 2, t: 0.35 });
          bullet = null;
          break;
        }
      }
    }
  }

  if (killCount === totalAliens) {
    state = 'levelClear';
    levelClearTimer = 2.2;
    return;
  }

  let minCol = COLS, maxCol = -1, maxRow = -1;
  for (const a of aliens) {
    if (!a.alive) continue;
    if (a.col < minCol) minCol = a.col;
    if (a.col > maxCol) maxCol = a.col;
    if (a.row > maxRow) maxRow = a.row;
  }

  alienOffsetX += effectiveSpeed() * dt * alienDir;
  const leftEdge = alienX(minCol);
  const rightEdge = alienX(maxCol) + ALIEN_W;

  if (alienDir === 1 && rightEdge >= W) {
    alienOffsetX -= rightEdge - W;
    alienDir = -1;
    alienGroupY += DROP_STEP;
  } else if (alienDir === -1 && leftEdge <= 0) {
    alienOffsetX -= leftEdge;
    alienDir = 1;
    alienGroupY += DROP_STEP;
  }

  if (alienY(maxRow) + ALIEN_H >= PLAYER_Y) {
    state = 'gameOver';
  }
}

// ── Drawing ──────────────────────────────────────────────────────────────────

function drawPlayer() {
  const { x, y } = player;
  ctx.fillStyle = '#00ff88';
  ctx.beginPath();
  ctx.moveTo(x + PLAYER_W / 2, y);
  ctx.lineTo(x + PLAYER_W, y + PLAYER_H * 0.72);
  ctx.lineTo(x, y + PLAYER_H * 0.72);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(x, y + PLAYER_H * 0.56, PLAYER_W, PLAYER_H * 0.44);
  ctx.fillRect(x + PLAYER_W / 2 - 2, y - 8, 4, 10);
  ctx.fillStyle = '#00cc66';
  ctx.fillRect(x + PLAYER_W / 2 - 8, y + PLAYER_H * 0.6, 16, 6);
}

function drawAlien(col, row) {
  const ax = alienX(col), ay = alienY(row);
  const cx = ax + ALIEN_W / 2, cy = ay + ALIEN_H / 2;
  ctx.save();
  ctx.translate(cx, cy);

  if (row === 0) {
    // UFO saucer
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.ellipse(0, 5, 17, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff8888';
    ctx.beginPath();
    ctx.ellipse(0, -1, 11, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff3333';
    ctx.fillRect(-5, -3, 3, 3);
    ctx.fillRect(2, -3, 3, 3);
    // Bottom lights
    ctx.fillStyle = '#ffaaaa';
    ctx.fillRect(-8, 7, 3, 3);
    ctx.fillRect(-1, 8, 3, 3);
    ctx.fillRect(6, 7, 3, 3);
  } else if (row <= 2) {
    // Crab
    ctx.fillStyle = '#ffaa00';
    ctx.fillRect(-11, -9, 22, 18);
    ctx.fillRect(-17, -7, 8, 5);
    ctx.fillRect(-17, 2, 6, 5);
    ctx.fillRect(9, -7, 8, 5);
    ctx.fillRect(11, 2, 6, 5);
    ctx.fillRect(-9, -14, 3, 7);
    ctx.fillRect(6, -14, 3, 7);
    ctx.fillStyle = '#000';
    ctx.fillRect(-7, -5, 4, 5);
    ctx.fillRect(3, -5, 4, 5);
    ctx.fillStyle = '#ffdd88';
    ctx.fillRect(-6, -4, 2, 3);
    ctx.fillRect(4, -4, 2, 3);
  } else {
    // Squid
    ctx.fillStyle = '#44aaff';
    ctx.fillRect(-9, -12, 18, 10);
    ctx.fillRect(-11, -4, 22, 14);
    ctx.fillRect(-11, 8, 4, 7);
    ctx.fillRect(-4, 8, 4, 9);
    ctx.fillRect(3, 8, 4, 9);
    ctx.fillRect(10, 8, 4, 7);
    ctx.fillRect(-8, -16, 5, 6);
    ctx.fillRect(3, -16, 5, 6);
    ctx.fillStyle = '#000';
    ctx.fillRect(-7, -9, 5, 5);
    ctx.fillRect(2, -9, 5, 5);
    ctx.fillStyle = '#88ccff';
    ctx.fillRect(-6, -8, 3, 3);
    ctx.fillRect(3, -8, 3, 3);
  }

  ctx.restore();
}

function drawExplosions() {
  for (const e of explosions) {
    const progress = 1 - e.t / 0.35;
    const alpha = e.t / 0.35;
    const r = 2 + progress * 24;
    ctx.strokeStyle = `rgba(255,180,40,${alpha})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = `rgba(255,240,180,${alpha * 0.45})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawBullet() {
  if (!bullet) return;
  ctx.fillStyle = '#ffff55';
  ctx.fillRect(bullet.x, bullet.y, BULLET_W, BULLET_H);
  ctx.fillStyle = 'rgba(255,255,80,0.2)';
  ctx.fillRect(bullet.x - 2, bullet.y, BULLET_W + 4, BULLET_H + 4);
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,10,0.85)';
  ctx.fillRect(0, 0, W, HUD_H);
  ctx.fillStyle = '#00ff88';
  ctx.font = 'bold 20px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE  ${score}`, 20, 31);
  ctx.textAlign = 'center';
  ctx.fillText(`LEVEL  ${level}`, W / 2, 31);
  ctx.fillStyle = '#888';
  ctx.font = '14px monospace';
  ctx.textAlign = 'right';
  const alive = totalAliens - killCount;
  ctx.fillText(`ALIENS: ${alive}`, W - 20, 31);
  ctx.strokeStyle = '#00ff8822';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, HUD_H - 1);
  ctx.lineTo(W, HUD_H - 1);
  ctx.stroke();
}

function blink() { return Math.floor(Date.now() / 500) % 2 === 0; }

function draw() {
  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, W, H);

  for (const s of STARS) {
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }

  if (state === 'start') {
    drawHUD();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 54px monospace';
    ctx.fillText('SPACE SHOOTER', W / 2, H / 2 - 90);
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('← →  or  A D   to move', W / 2, H / 2 - 14);
    ctx.fillText('SPACE to fire', W / 2, H / 2 + 18);
    ctx.fillStyle = '#ffaa00';
    ctx.fillText('Destroy all aliens to advance levels!', W / 2, H / 2 + 62);
    if (blink()) {
      ctx.fillStyle = '#00ff88';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('PRESS SPACE TO PLAY', W / 2, H / 2 + 124);
    }
    ctx.textAlign = 'left';
    return;
  }

  if (state === 'gameOver') {
    drawHUD();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 62px monospace';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 80);
    ctx.fillStyle = '#fff';
    ctx.font = '26px monospace';
    ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 - 8);
    ctx.fillText(`Level Reached: ${level}`, W / 2, H / 2 + 34);
    if (blink()) {
      ctx.fillStyle = '#00ff88';
      ctx.font = 'bold 20px monospace';
      ctx.fillText('PRESS SPACE TO PLAY AGAIN', W / 2, H / 2 + 110);
    }
    ctx.textAlign = 'left';
    return;
  }

  for (const a of aliens)
    if (a.alive) drawAlien(a.col, a.row);

  drawExplosions();
  drawPlayer();
  drawBullet();

  ctx.strokeStyle = '#00ff8833';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, PLAYER_Y + PLAYER_H + 6);
  ctx.lineTo(W, PLAYER_Y + PLAYER_H + 6);
  ctx.stroke();

  drawHUD();

  if (state === 'levelClear') {
    ctx.fillStyle = 'rgba(0,0,10,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffff44';
    ctx.font = 'bold 50px monospace';
    ctx.fillText(`LEVEL ${level} CLEAR!`, W / 2, H / 2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 28);
    ctx.textAlign = 'left';
  }
}

// ── Game loop ─────────────────────────────────────────────────────────────────

let lastTime = null;
function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  explosions = explosions ? explosions.filter(e => { e.t -= dt; return e.t > 0; }) : [];

  if (state === 'levelClear') {
    levelClearTimer -= dt;
    if (levelClearTimer <= 0) {
      level++;
      initLevel();
      state = 'playing';
    }
  } else if (state === 'playing') {
    update(dt);
  }

  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
